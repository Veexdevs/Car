name: Godot 4 verification
on:
  workflow_dispatch:
  push:
    branches: [arena/0c845879-car]
    paths-ignore:
      - 'docs/verification/**'
      - 'Releases/**'
      - 'README.md'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install software renderer
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: Download official Godot 4.4.1
        run: |
          curl -L --fail -o godot.zip https://github.com/godotengine/godot/releases/download/4.4.1-stable/Godot_v4.4.1-stable_linux.x86_64.zip
          unzip -o godot.zip
          chmod +x Godot_v4.4.1-stable_linux.x86_64
      - name: Import all project resources
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --editor --import --quit
      - name: Run gameplay and system tests
        run: ./Godot_v4.4.1-stable_linux.x86_64 --headless --path . --audio-driver Dummy --script Tests/run_tests.gd
      - name: Capture cockpit and pilot body
        run: xvfb-run -a -s "-screen 0 1280x720x24" ./Godot_v4.4.1-stable_linux.x86_64 --path . --rendering-method gl_compatibility --audio-driver Dummy --script Tests/capture_verification.gd
      - name: Save verification evidence to this branch
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/verification
          if ! git diff --cached --quiet; then
            git commit -m "test: Godot 4.4.1 verification evidence [skip ci]"
            git pull --rebase origin arena/0c845879-car
            git push origin HEAD:arena/0c845879-car
          fi
